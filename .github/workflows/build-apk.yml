name: Build Sena Reply APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'SenaReplyAndroid-v1.1.0-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Sena Reply source
        run: unzip -q -o SenaReplyAndroid-v1.1.0-source.zip

      - name: Apply build compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('SenaReplyAndroid-v1.1.0/app/src/main/res/values/strings.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace("Android's", r"Android\'s")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build APK and capture log
        id: build
        shell: bash
        run: |
          rm -rf build-output
          mkdir -p build-output
          set +e
          (cd SenaReplyAndroid-v1.1.0 && gradle assembleDebug --stacktrace) > build-output/build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] && [ -f SenaReplyAndroid-v1.1.0/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp SenaReplyAndroid-v1.1.0/app/build/outputs/apk/debug/app-debug.apk build-output/SenaReply-v1.1.0-debug.apk
            printf 'SUCCESS\nBuilt from commit: %s\n' "$GITHUB_SHA" > build-output/build-status.txt
          else
            printf 'FAILED\nExit code: %s\nBuilt from commit: %s\n' "$code" "$GITHUB_SHA" > build-output/build-status.txt
          fi
          exit 0

      - name: Publish build result to repository
        shell: bash
        run: |
          git config user.name "Sena Reply Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -f build-output/build-status.txt build-output/build.log
          if [ -f build-output/SenaReply-v1.1.0-debug.apk ]; then
            git add -f build-output/SenaReply-v1.1.0-debug.apk
          fi
          git commit -m "Publish Sena Reply v1.1.0 build result" || true
          git push

      - name: Upload APK artifact
        if: ${{ steps.build.outputs.exit_code == '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: SenaReply-v1.1.0-debug
          path: build-output/SenaReply-v1.1.0-debug.apk
          if-no-files-found: error

      - name: Mark workflow failed when Gradle failed
        if: ${{ steps.build.outputs.exit_code != '0' }}
        run: exit 1
