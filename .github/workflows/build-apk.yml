name: Build Sena Reply APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'SenaReplyAndroid-v1.1.0-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Sena Reply source
        run: unzip -q SenaReplyAndroid-v1.1.0-source.zip

      - name: Build debug APK
        working-directory: SenaReplyAndroid-v1.1.0
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp SenaReplyAndroid-v1.1.0/app/build/outputs/apk/debug/app-debug.apk SenaReply-v1.1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenaReply-v1.1.0-debug
          path: SenaReply-v1.1.0-debug.apk
          if-no-files-found: error
